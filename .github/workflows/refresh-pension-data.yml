name: Refresh pension disclosure data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-pension-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh FSS disclosure data
        env:
          FSS_API_KEY: ${{ secrets.FSS_API_KEY }}
        run: node scripts/fetch-pensions.mjs
      - name: Commit updated data
        run: |
          if git diff --quiet -- github-pages/data/pensions.json; then
            echo "No disclosure changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/data/pensions.json
          git commit -m "Refresh pension disclosure data"
          git push
